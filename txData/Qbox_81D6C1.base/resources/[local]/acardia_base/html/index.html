<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;pointer-events:none}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div id="mapBorder"></div>

    <div id="infoBar">
      <div class="timeBlock">
        <svg class="weather" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <span id="clock">00:00</span>
      </div>
      <div class="locationBlock">
        <span id="street">Los Santos</span>
        <span id="zone">SAN ANDREAS</span>
      </div>
    </div>

    <div id="statsColumn">
      <div class="stat hunger"><svg class="ring" viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="progress" cx="22" cy="22" r="18"/></svg><div class="icon"><svg viewBox="0 0 24 24"><path d="M4 3v8a2 2 0 0 0 2 2h1v8h2V3H4zm11 0c-1.7 3-2 6-2 9v9h2v-6h1c2 0 3-2 3-5V3h-4z"/></svg></div></div>
      <div class="stat thirst"><svg class="ring" viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="progress" cx="22" cy="22" r="18"/></svg><div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2s7 8 7 13a7 7 0 1 1-14 0c0-5 7-13 7-13z"/></svg></div></div>
      <div class="stat energy"><svg class="ring" viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="progress" cx="22" cy="22" r="18"/></svg><div class="icon"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 10-14h-7l0-6z"/></svg></div></div>
      <div class="stat armor"><svg class="ring" viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="progress" cx="22" cy="22" r="18"/></svg><div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5.2 3.4 9.4 8 10.7C16.6 21.4 20 17.2 20 12V6l-8-4z"/></svg></div></div>
      <div class="stat health"><svg class="ring" viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="progress" cx="22" cy="22" r="18"/></svg><div class="icon"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div></div>
    </div>
  </div>

  <div id="deathScreen" class="hidden">
    <div class="death-overlay"></div>
    <div class="death-content">
      <div class="ecg-wrap">
        <svg class="ecg" viewBox="0 0 600 100" preserveAspectRatio="none" aria-hidden="true">
          <polyline class="ecg-line" points="0,50 40,50 55,50 65,20 75,80 85,35 95,65 105,50 140,50 155,50 165,20 175,80 185,35 195,65 205,50 240,50 255,50 265,20 275,80 285,35 295,65 305,50 340,50 355,50 365,20 375,80 385,35 395,65 405,50 440,50 455,50 465,20 475,80 485,35 495,65 505,50 540,50 555,50 565,20 575,80 585,35 595,65 600,50" />
        </svg>
      </div>
      <h1 class="death-title">Vous êtes mort</h1>
      <p class="death-sub">Attendez l&apos;arrivée des secours</p>
      <div class="death-timer-wrap">
        <span class="death-timer-label">Respawn disponible dans</span>
        <span id="deathTimer" class="death-timer-value">300</span>
        <span class="death-timer-label">secondes</span>
      </div>
      <div class="death-actions">
        <button type="button" class="death-btn" data-service="lsmd">Appeler le LSMD</button>
        <button type="button" class="death-btn death-btn-alt" data-service="bcmd">Appeler le BCMD</button>
      </div>
      <div class="death-actions" style="margin-top:1.5vh">
        <button type="button" class="death-btn death-btn-respawn hidden" id="respawnBtn">Réapparaître</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
