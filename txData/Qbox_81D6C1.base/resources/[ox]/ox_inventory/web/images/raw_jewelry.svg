<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="45%" stop-color="#e0b03a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a9a"/>
      <stop offset="100%" stop-color="#b0123a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffb8"/>
      <stop offset="100%" stop-color="#0d7a48"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ecbff"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amethyst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9b4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="228" rx="78" ry="12" fill="#000" opacity="0.28"/>
  <g filter="url(#sh)">
    <!-- gold chain -->
    <path d="M48 86 C70 70, 90 118, 112 96 C128 80, 140 120, 168 92 C186 76, 198 110, 214 98"
          fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M52 98 C78 84, 96 130, 122 108 C140 92, 154 132, 182 106"
          fill="none" stroke="#f6d36a" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- gold ring -->
    <ellipse cx="78" cy="168" rx="28" ry="16" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <ellipse cx="78" cy="168" rx="18" ry="9" fill="none" stroke="#fff2b0" stroke-width="2" opacity="0.45"/>
    <!-- pendant -->
    <polygon points="168,118 188,154 168,186 148,154" fill="url(#gold)"/>
    <polygon points="168,128 180,154 168,176 156,154" fill="#fff2b0" opacity="0.25"/>
    <!-- gems -->
    <polygon points="128,58 152,92 128,118 104,92" fill="url(#ruby)"/>
    <polygon points="128,66 144,92 128,108 112,92" fill="#fff" opacity="0.28"/>
    <polygon points="196,138 218,168 196,192 174,168" fill="url(#emerald)"/>
    <polygon points="196,146 210,168 196,182 182,168" fill="#fff" opacity="0.22"/>
    <polygon points="112,148 132,176 112,198 92,176" fill="url(#sapphire)"/>
    <polygon points="112,156 124,176 112,188 100,176" fill="#fff" opacity="0.25"/>
    <polygon points="54,118 72,140 54,158 36,140" fill="url(#amethyst)"/>
    <polygon points="54,124 64,140 54,150 44,140" fill="#fff" opacity="0.28"/>
  </g>
</svg>
