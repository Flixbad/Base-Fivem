<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d8a4e"/>
      <stop offset="100%" stop-color="#1a5c32"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f48"/>
      <stop offset="100%" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#c99220"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="226" rx="78" ry="12" fill="#000" opacity="0.28"/>
  <g filter="url(#sh)">
    <!-- PCB board -->
    <rect x="38" y="48" width="180" height="150" rx="10" fill="url(#pcb)"/>
    <rect x="46" y="56" width="164" height="134" rx="6" fill="none" stroke="#7dffb0" stroke-width="1.5" opacity="0.25"/>
    <!-- traces -->
    <g fill="none" stroke="#7dffb0" stroke-width="2" opacity="0.45">
      <path d="M58 78 H118 V110 H168"/>
      <path d="M70 168 H140 V128 H198"/>
      <path d="M58 128 H92"/>
      <path d="M178 78 V118"/>
    </g>
    <!-- CPU -->
    <rect x="86" y="86" width="72" height="72" rx="6" fill="url(#chip)"/>
    <rect x="96" y="96" width="52" height="52" rx="3" fill="#2a2e36"/>
    <rect x="108" y="108" width="28" height="28" rx="2" fill="#11141a"/>
    <!-- CPU pins -->
    <g fill="url(#goldPin)">
      <rect x="90" y="80" width="6" height="8" rx="1"/>
      <rect x="102" y="80" width="6" height="8" rx="1"/>
      <rect x="114" y="80" width="6" height="8" rx="1"/>
      <rect x="126" y="80" width="6" height="8" rx="1"/>
      <rect x="138" y="80" width="6" height="8" rx="1"/>
      <rect x="150" y="80" width="6" height="8" rx="1"/>
    </g>
    <!-- RAM stick -->
    <rect x="48" y="62" width="28" height="96" rx="3" fill="#1e3a8a"/>
    <rect x="52" y="70" width="20" height="14" rx="1" fill="#111827"/>
    <rect x="52" y="90" width="20" height="14" rx="1" fill="#111827"/>
    <rect x="52" y="110" width="20" height="14" rx="1" fill="#111827"/>
    <rect x="52" y="130" width="20" height="14" rx="1" fill="#111827"/>
    <rect x="50" y="150" width="24" height="6" fill="url(#goldPin)"/>
    <!-- capacitors -->
    <circle cx="186" cy="78" r="10" fill="#c9a227"/>
    <circle cx="186" cy="78" r="6" fill="#8a6a12"/>
    <circle cx="186" cy="108" r="8" fill="#3b82f6"/>
    <circle cx="186" cy="108" r="4" fill="#1e40af"/>
    <rect x="176" y="128" width="22" height="12" rx="2" fill="#ef4444"/>
    <rect x="176" y="146" width="22" height="12" rx="2" fill="#22c55e"/>
    <!-- USB / ports -->
    <rect x="88" y="176" width="36" height="12" rx="2" fill="#111827"/>
    <rect x="132" y="176" width="36" height="12" rx="2" fill="#111827"/>
  </g>
</svg>
